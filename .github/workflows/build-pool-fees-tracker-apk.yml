name: Build Pool Fees Tracker APK

on:
  push:
    branches:
      - '**'
    paths:
      - 'pool_fees_tracker/**'
      - '.github/workflows/build-pool-fees-tracker-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pool_fees_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pool-fees-tracker-apk
          path: pool_fees_tracker/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
